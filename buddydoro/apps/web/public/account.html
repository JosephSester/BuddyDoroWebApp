<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Account Settings • BuddyDoro</title>

  <!-- Core styles -->
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout2.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/themes.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="../styles/accountSettings.css" />

  <!-- Preload (optional) -->
  <link rel="preload" as="image" href="./assets/artwork/BackgroundDay.jpg" />
</head>

<body class="bd-page">
  <header class="bd-settings-top">
    <a href="index.html" class="bd-back-link" aria-label="Back to home">← Back</a>

    <div class="bd-settings-header">
      <h1 class="bd-settings-title">Account Settings</h1>
      <p class="bd-settings-subtitle">Update your email and password.</p>
    </div>
  </header>

  <main class="bd-settings-shell">
    <form id="accountForm" class="bd-form" novalidate>

      <!-- Email card -->
      <section class="bd-card" aria-labelledby="emailCardTitle">
        <h2 id="emailCardTitle" class="bd-card-title">Email</h2>
      
        <div class="bd-field">
          <!-- Current Email (read-only) -->
          <label for="currentEmail" class="bd-label">Current email</label>
          <input id="currentEmail" type="email" class="bd-input" autocomplete="email" disabled />
      
          <!-- New Email -->
          <label for="newEmail" class="bd-label">New email</label>
          <input id="newEmail" type="email" class="bd-input" autocomplete="off" placeholder="you@example.com"
           />
      
          <!-- Confirm New Email -->
          <label for="confirmNewEmail" class="bd-label">Confirm new email</label>
          <input id="confirmNewEmail" type="email" class="bd-input" autocomplete="off" placeholder="re-enter new email"
            />
          <div class="bd-hint">We’ll use this to identify your account.</div>
        </div>
      </section>

      <!-- Password card -->
      <section class="bd-card" aria-labelledby="pwCardTitle">
        <h2 id="pwCardTitle" class="bd-card-title">Password</h2>

        <div class="bd-hint bd-hint-strong">
          Leave these blank if you don’t want to change your password.
        </div>
        <!-- Current Password -->
        <div class="bd-field">
          <label for="currentPassword" class="bd-label">Current password</label>
          <input
            id="currentPassword"
            type="password"
            autocomplete="off"
            class="bd-input"
          />
        </div>
        <!-- New Password -->
        <div class="bd-field">
          <label for="newPassword" class="bd-label">New password</label>
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            class="bd-input"
            aria-describedby="pwHint"
          />
          <!-- Confirm New Password -->
          <label for="confirmNewPassword" class="bd-label">Confirm New password</label>
          <input
            id="confirmNewPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            class="bd-input"
            aria-describedby="pwHint"
          />
          <div id="pwHint" class="bd-hint">Use 8+ characters. Avoid common words.</div>
        </div>
      </section>

      <!-- Actions -->
      <section class="bd-card bd-card-muted" aria-label="Save changes">
        <div class="bd-actions">
          <button type="submit" class="bd-btn bd-btn-primary" id="saveBtn">Save changes</button>
          <a href="./index.html" class="bd-btn bd-btn-secondary">Cancel</a>
        </div>

        <p id="accountMsg" class="bd-msg is-info" role="status" aria-live="polite"></p>
      </section>
    </form>
  </main>

  <script type="module" src="../js/pages/accountSettings.js"></script>
</body>
</html>
