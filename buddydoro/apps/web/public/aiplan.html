<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Planner — BuddyDoro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles/notifications.css" />
  <link rel="stylesheet" href="../styles/ai-plan.css" />
  <link rel="stylesheet" href="../styles/aiplan-page.css" />
</head>
<body>

  <!-- Top bar -->
  <header class="aipage-topbar">
    <a href="index.html" class="aipage-back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </a>
    <span class="aipage-topbar-title">
      <svg width="18" height="18" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 6l2.5 7.5L34 16l-7.5 2.5L24 26l-2.5-7.5L14 16l7.5-2.5L24 6z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M36 28l1.4 4 4 1.4-4 1.4L36 39l-1.4-4-4-1.4 4-1.4L36 28z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      AI Planner
    </span>
  </header>

  <!-- Page layout -->
  <div class="aipage-layout">

    <!-- Left: goal input -->
    <aside class="aipage-input-panel">
      <div class="aipage-card">
        <p class="aipage-input-heading">What's your goal?</p>
        <p class="aipage-input-sub">Describe it in a sentence or two</p>
        <textarea
          id="aiGoalInput"
          class="aipage-textarea"
          rows="5"
          placeholder="e.g. Learn React in 2 weeks, prepare for my exam, build a personal project…"
        ></textarea>
        <button id="aiGenerateBtn" class="aipage-generate-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 6l2.5 7.5L34 16l-7.5 2.5L24 26l-2.5-7.5L14 16l7.5-2.5L24 6z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M36 28l1.4 4 4 1.4-4 1.4L36 39l-1.4-4-4-1.4 4-1.4L36 28z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          Generate Plan
        </button>
        <p class="aipage-hint">Edit tasks and subtasks before saving</p>
      </div>
    </aside>

    <!-- Right: task preview -->
    <section class="aipage-preview-panel">
      <p class="aipage-preview-heading">Your Plan</p>
      <p id="aiPlanDescription"></p>
      <div id="aiPlanPreview" aria-live="polite"></div>
    </section>

  </div>

  <!-- Sticky footer -->
  <footer class="aipage-footer">
    <button id="aiAddTaskBtn" class="aipage-add-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Task
    </button>
    <button id="aiCreatePlanBtn" class="aipage-create-btn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Save Plan
    </button>
  </footer>

  <div id="notification-container"></div>

  <script type="module">
    import { initAiPlanPage } from '../js/features/aiPlan.js';
    initAiPlanPage();
  </script>

</body>
</html>
