<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BuddyDoro - Sign Up</title>

  <link rel="preload" as="image" href="./assets/artwork/BackgroundDay.jpg" />
  <link rel="preload" as="image" href="./assets/artwork/Dragon.png" />

  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/scene.css" />
  
  <link rel="stylesheet" href="../styles/signup.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
  <div id="scene" class="scene"></div> <!-- This will be populated by scene.js -->

  <div class="ui-layer">
    <div class="signup-card">
      <img src="./assets/artwork/Dragon.png" alt="BuddyDoro Dragon" class="signup-dragon">
      <h2 class="welcome-text">Sign Up to BuddyDoro!</h2>

      <form id="signupForm" class="signup-form" novalidate>
        
        <div class="form-field">
          <label for="nameInput" class="sr-only">Name</label>
          <input type="text" id="nameInput" required placeholder="Name">
        </div>

        <div class="form-field">
          <label for="emailInput" class="sr-only">Email Address</label>
          <input type="email" id="emailInput" required placeholder="Email Address">
        </div>

        <div class="form-field password-field">
          <label for="passwordInput" class="sr-only">Password</label>
          <input type="password" id="passwordInput" required placeholder="Password">
          <span class="password-toggle" id="passwordToggle">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <div class="form-field password-field">
          <label for="confirmPasswordInput" class="sr-only">Confirm Password</label>
          <input type="password" id="confirmPasswordInput" required placeholder="Confirm Password">
          <span class="password-toggle" id="confirmPasswordToggle">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <div id="signupError" class="signup-error" hidden></div>

        <div class="signup-button-container">
          <button type="submit" class="btn-primary signup-btn">Sign Up</button>
        </div>

      </form>

      <div class="signup-terms">
        By signing up, you agree to the Privacy Policy and Terms of Service.
      </div>
    </div>
  </div>

  <script src="../js/scene.js"></script>
  <script src="../js/signup.js"></script>
</body>
</html>
